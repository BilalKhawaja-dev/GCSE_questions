version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo "Installing dependencies..."
      - pip install --upgrade pip
      - pip install -r requirements.txt
      - echo "Dependencies installed successfully"
  
  pre_build:
    commands:
      - echo "Pre-build phase started on `date`"
      - echo "Current directory:"
      - pwd
      - echo "Directory contents:"
      - ls -la
      - echo "Python version:"
      - python --version
      - echo "Setting up Python path..."
      - export PYTHONPATH="${PYTHONPATH}:."
      - echo "PYTHONPATH is: $PYTHONPATH"
      - echo "Checking if src directory exists:"
      - ls -la src/
      - echo "Checking lambda_handlers directory:"
      - ls -la src/lambda_handlers/
      - echo "Checking models directory:"
      - ls -la src/models/
      - echo "Checking utils directory:"
      - ls -la src/utils/
      - echo "Testing basic Python import:"
      - python -c "import sys; print('Python path:', sys.path)"
      - echo "Testing src import:"
      - python -c "import src"
      - echo "Testing models import:"
      - python -c "from src.models import QueryIntent"
      - echo "Running code quality checks..."
      - python -m py_compile src/lambda_handlers/interpret_lambda.py
      - python -m py_compile src/lambda_handlers/generate_lambda.py
      - echo "Code quality checks passed"
  
  build:
    commands:
      - echo "Build phase started on `date`"
      - echo "Setting up Python path for tests..."
      - export PYTHONPATH="${PYTHONPATH}:."
      - echo "Running unit tests..."
      - python -m pytest tests/ -v --tb=short
      - echo "Running property-based tests..."
      - python -m pytest tests/test_property_*.py -v --hypothesis-show-statistics
      - echo "All tests completed successfully"
  
  post_build:
    commands:
      - echo "Post-build phase started on `date`"
      - echo "Setting up Python path for coverage..."
      - export PYTHONPATH="${PYTHONPATH}:."
      - echo "Generating test coverage report..."
      - python -m pytest tests/ --cov=src --cov-report=term-missing --cov-report=html:htmlcov
      - echo "Test coverage report generated"
      - echo "Build completed on `date`"

artifacts:
  files:
    - '**/*'
  name: gcse-question-generator-$(date +%Y-%m-%d)

cache:
  paths:
    - '/root/.cache/pip/**/*'